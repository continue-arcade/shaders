[package]
name = "continue-shader-carts"
version = "0.1.0"
edition = "2024"
rust-version = "1.93.1"
license = "MIT"
description = "Deterministic, source-locked Continue Arcade Shader Cart generator"

[dependencies]
semver = "1"
language-tags = "0.3"
librashader-presets = "=0.12.1"
librashader-preprocess = "=0.12.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
toml = "0.8"
zip = { version = "2.4", default-features = false }

tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
