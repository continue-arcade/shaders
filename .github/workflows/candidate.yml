name: 发布候选

on:
  workflow_dispatch:
    inputs:
      family:
        description: 已登记的家族 slug；每次只发布一个家族
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: shader-candidate-${{ inputs.family }}
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
      FAMILY: ${{ inputs.family }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
      - name: 安装 Rust 检查组件
        run: mise exec -- rustup component add --toolchain 1.93.1 rustfmt clippy
      - name: 验证并生成指定家族
        run: |
          mise run check
          mise exec -- cargo run --locked -- build --family "$FAMILY" --out dist
      - name: 建立单家族草稿候选（拒绝已有 tag 与 Release）
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_REVISION: ${{ github.sha }}
        run: mise exec -- python3 scripts/candidate.py --family "$FAMILY" --out dist --revision "$SOURCE_REVISION"
