name: 检查与构建

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
      - name: 安装 Rust 检查组件
        run: mise exec -- rustup component add --toolchain 1.93.1 rustfmt clippy
      - name: Rust 工程门禁
        run: mise run check
      - name: 生成自包含家族 Cart
        run: mise exec -- cargo run --locked -- build --family zfast-crt --out dist
